services:
  - type: web
    name: ladelogistik
    runtime: node
    buildCommand: npm install && npx vite build
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
    disk:
      name: data
      mountPath: /app/data
      sizeGB: 1
